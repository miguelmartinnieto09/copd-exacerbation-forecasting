[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copd-exacerbation-forecasting"
version = "0.1.0"
description = "Machine learning pipeline for forecasting COPD-related emergency department visits."
readme = "README.md"
requires-python = ">=3.10,<3.11"

[tool.setuptools.packages.find]
where = ["src"]